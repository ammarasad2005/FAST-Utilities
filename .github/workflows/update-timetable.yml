name: Update Timetable Data

on:
  # Run every 20 minutes
  schedule:
    - cron: '*/20 * * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

# Grant the workflow permission to write commits back to the repo
permissions:
  contents: write

jobs:
  update-timetable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MAIN_PUSH_TOKEN }}

      # 2. Set up Python (pins version for reproducibility)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Run the dispatcher Python script to regenerate timetable.json
      - name: Generate timetable.json
        run: python3 scripts/run_parser.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GOOGLE_SHEETS_API_KEY: ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # 4. Copy the fresh timetable.json into the Next.js public/data folder
      - name: Copy timetable.json to frontend public/data
        run: |
          mkdir -p public/data
          cp timetable.json public/data/timetable.json

      # 5. Only commit and push if something actually changed
      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/timetable.json
          # Check if there is anything new to commit
          if git diff --staged --quiet; then
            echo "No changes detected — timetable is up to date."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: auto-update timetable.json [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "Timetable updated and pushed."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 6. Instant push ping: once Vercel serves the fresh file, notify phones
      - name: Set up Node.js
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install push helper deps
        if: steps.commit.outputs.changed == 'true'
        run: npm ci --prefix scripts/push

      - name: Fan out FCM ping (campus_updates)
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/push/fanout.js --keys=data:timetable:FSC --file=public/data/timetable.json --url=https://fast-nuces-isb.vercel.app/data/timetable.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
